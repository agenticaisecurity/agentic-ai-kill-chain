<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1260" width="1600" height="1260"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a4c6de" stroke-opacity=".045"/></pattern><radialGradient id="glow"><stop stop-color="#0e625e" stop-opacity=".4"/><stop offset="1" stop-color="#0b1321" stop-opacity="0"/></radialGradient></defs><rect width="100%" height="100%" fill="#0b1321"/><rect width="100%" height="100%" fill="url(#grid)"/><ellipse cx="1300" cy="180" rx="630" ry="400" fill="url(#glow)"/><text x="72" y="80" fill="#7ee3d2" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">SIX QUESTIONS FOR AN ATTACK PATH</text><text x="68" y="160" fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700">Where does the boundary fail?</text><text x="72" y="213" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400">Identify the actor, permissions, input and impact at every step.</text><rect x="72" y="270" width="712" height="250" rx="16" fill="#132238" stroke="#29415b"/><text x="100" y="317" fill="#7ee3d2" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">01</text><text x="155" y="319" fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">RECON</text><text x="100" y="375" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400">Map reachable tools, identities,</text><text x="100" y="413" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400">resource scopes and delegation.</text><text x="100" y="477" fill="#7ee3d2" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400">Check: what can this principal do?</text><rect x="816" y="270" width="712" height="250" rx="16" fill="#132238" stroke="#29415b"/><text x="844" y="317" fill="#7ee3d2" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">02</text><text x="899" y="319" fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">INJECT</text><text x="844" y="375" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400">Attacker-controlled content reaches</text><text x="844" y="413" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400">a model through an allowed input.</text><text x="844" y="477" fill="#7ee3d2" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400">Delivery does not prove influence.</text><rect x="72" y="550" width="712" height="250" rx="16" fill="#132238" stroke="#29415b"/><text x="100" y="597" fill="#7ee3d2" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">03</text><text x="155" y="599" fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">HIJACK</text><text x="100" y="655" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400">Attacker influence redirects actions</text><text x="100" y="693" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400">away from the authorized task.</text><text x="100" y="757" fill="#7ee3d2" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400">Observe behavior in the attacker’s favor.</text><rect x="816" y="550" width="712" height="250" rx="16" fill="#132238" stroke="#766034"/><text x="844" y="597" fill="#efbe65" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">04</text><text x="899" y="599" fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">ESCALATE</text><text x="844" y="655" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400">Effective authority increases, for</text><text x="844" y="693" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400">example through a confused deputy.</text><text x="844" y="757" fill="#efbe65" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400">Existing permission misuse ≠ escalation.</text><rect x="72" y="830" width="712" height="250" rx="16" fill="#132238" stroke="#29415b"/><text x="100" y="877" fill="#7ee3d2" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">05</text><text x="155" y="879" fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">EXFILTRATE</text><text x="100" y="935" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400">Protected information reaches an</text><text x="100" y="973" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400">unauthorized recipient.</text><text x="100" y="1037" fill="#7ee3d2" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400">An output needs an observable destination.</text><rect x="816" y="830" width="712" height="250" rx="16" fill="#132238" stroke="#29415b"/><text x="844" y="877" fill="#7ee3d2" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">06</text><text x="899" y="879" fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">PERSIST</text><text x="844" y="935" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400">Durable changes may influence</text><text x="844" y="973" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400">later runs if retrieved and followed.</text><text x="844" y="1037" fill="#7ee3d2" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400">Persistence is conditional, not automatic.</text><text x="72" y="1169" fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Example without escalation: INJECT → HIJACK → EXFILTRATE</text><text x="72" y="1215" fill="#9eb3ca" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Illustrative categories, not a mandatory sequence or complete threat taxonomy.   @mdha81</text></svg>