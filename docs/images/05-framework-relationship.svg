<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a4c6de" stroke-opacity=".045"/></pattern><radialGradient id="glow"><stop stop-color="#0e625e" stop-opacity=".4"/><stop offset="1" stop-color="#0b1321" stop-opacity="0"/></radialGradient></defs><rect width="100%" height="100%" fill="#0b1321"/><rect width="100%" height="100%" fill="url(#grid)"/><ellipse cx="1300" cy="180" rx="630" ry="400" fill="url(#glow)"/><text x="72" y="80" fill="#7ee3d2" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">COMPLEMENTARY PERSPECTIVES</text><text x="68" y="157" fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700">Different questions. Shared foundations.</text><rect x="72" y="225" width="1456" height="212" rx="16" fill="#132238" stroke="#29415b"/><text x="100" y="274" fill="#7ee3d2" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">MITRE ATLAS</text><text x="100" y="318" fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Adversary behavior against AI systems</text><text x="100" y="365" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Versioned tactic and technique vocabulary, including agent threats.</text><text x="100" y="402" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">This article pins its identifier checks to release 2026.01.</text><rect x="72" y="463" width="1456" height="212" rx="16" fill="#132238" stroke="#29415b"/><text x="100" y="512" fill="#7ee3d2" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">OWASP RISK GUIDANCE</text><text x="100" y="556" fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Application and agent risk categories</text><text x="100" y="603" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">LLM Top 10 (2025) and Top 10 for Agentic Applications (2026).</text><text x="100" y="640" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Use both lists; assess severity in the actual deployment.</text><rect x="72" y="701" width="1456" height="212" rx="16" fill="#132238" stroke="#766034"/><text x="100" y="750" fill="#efbe65" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">THIS PRACTITIONER MODEL</text><text x="100" y="794" fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">A narrative for selected attack paths</text><text x="100" y="841" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Connect inputs, authority, actions and consequences.</text><text x="100" y="878" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Six teaching categories; not a replacement or complete taxonomy.</text><text x="72" y="1007" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400">Author’s interpretation. No MITRE or OWASP endorsement or validation is claimed.   @mdha81</text></svg>