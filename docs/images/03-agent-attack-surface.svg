<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="1600" height="1050"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a4c6de" stroke-opacity=".045"/></pattern><radialGradient id="glow"><stop stop-color="#0e625e" stop-opacity=".4"/><stop offset="1" stop-color="#0b1321" stop-opacity="0"/></radialGradient></defs><rect width="100%" height="100%" fill="#0b1321"/><rect width="100%" height="100%" fill="url(#grid)"/><ellipse cx="1300" cy="180" rx="630" ry="400" fill="url(#glow)"/><text x="64" y="76" fill="#7ee3d2" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">ILLUSTRATIVE AGENT ARCHITECTURE</text><text x="60" y="153" fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700">Trace the authority behind each action</text><path d="M284 480H390" fill="none" stroke="#5c8097" stroke-width="3" stroke-dasharray="8 7"/><path d="M680 480H825" fill="none" stroke="#5c8097" stroke-width="3" stroke-dasharray="8 7"/><path d="M1115 480H1160V330H1210" fill="none" stroke="#5c8097" stroke-width="3" stroke-dasharray="8 7"/><path d="M1160 480H1210" fill="none" stroke="#5c8097" stroke-width="3" stroke-dasharray="8 7"/><path d="M1160 480V665H1210" fill="none" stroke="#5c8097" stroke-width="3" stroke-dasharray="8 7"/><path d="M535 385V348" fill="none" stroke="#5c8097" stroke-width="3" stroke-dasharray="8 7"/><path d="M535 620V714" fill="none" stroke="#5c8097" stroke-width="3" stroke-dasharray="8 7"/><rect x="48" y="409" width="236" height="154" rx="16" fill="#132238" stroke="#29415b"/><text x="72" y="452" fill="#7ee3d2" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">USER / INPUT</text><text x="72" y="497" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Request, document</text><text x="72" y="529" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">or retrieved content</text><rect x="390" y="385" width="290" height="235" rx="16" fill="#132238" stroke="#29415b"/><text x="414" y="428" fill="#7ee3d2" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">AI AGENT</text><text x="414" y="473" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Context and planning</text><text x="414" y="505" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Tool selection</text><text x="414" y="537" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Observable actions</text><text x="414" y="569" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Task instructions</text><rect x="825" y="409" width="290" height="154" rx="16" fill="#132238" stroke="#29415b"/><text x="849" y="452" fill="#7ee3d2" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">TOOL INTERFACE</text><text x="849" y="497" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Example: MCP server</text><text x="849" y="529" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Dispatch and policy</text><rect x="1210" y="235" width="338" height="154" rx="16" fill="#132238" stroke="#29415b"/><text x="1234" y="278" fill="#7ee3d2" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">TOOLS</text><text x="1234" y="323" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Filesystem, shell, code</text><text x="1234" y="355" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Effective execution identity</text><rect x="1210" y="420" width="338" height="154" rx="16" fill="#132238" stroke="#29415b"/><text x="1234" y="463" fill="#7ee3d2" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">DATA</text><text x="1234" y="508" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Documents, DB, retrieval</text><text x="1234" y="540" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Resource / tenant scope</text><rect x="1210" y="605" width="338" height="154" rx="16" fill="#132238" stroke="#29415b"/><text x="1234" y="648" fill="#7ee3d2" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">EXTERNAL APIs</text><text x="1234" y="693" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Email, messages, web</text><text x="1234" y="725" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Destination and data scope</text><rect x="390" y="220" width="290" height="128" rx="16" fill="#132238" stroke="#29415b"/><text x="414" y="263" fill="#7ee3d2" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">SUB-AGENTS</text><text x="414" y="308" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Delegation authority</text><rect x="390" y="714" width="290" height="154" rx="16" fill="#132238" stroke="#29415b"/><text x="414" y="757" fill="#7ee3d2" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">DURABLE STATE</text><text x="414" y="802" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Memory, instruction files</text><text x="414" y="834" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Writer and reader trust</text><text x="729" y="443" fill="#b6c9dd" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">request</text><text x="720" y="520" fill="#b6c9dd" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">response</text><rect x="825" y="807" width="723" height="113" rx="16" fill="#222631" stroke="#766034"/><text x="850" y="849" fill="#efbe65" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">A connection is not automatically a trust boundary.</text><text x="850" y="885" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400">Check identity, permissions, provenance and task scope.</text><text x="64" y="988" fill="#c5d4e6" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400">The model proposes an action. The execution environment determines what is allowed.  •  @mdha81</text></svg>